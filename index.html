<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的品牌｜社群工作台</title>
<style>
  /* ===== 顏色和風格都在這裡改 ===== */
  :root {
    --main: #8a5a3b;
    --bg: #f6efe8;
    --text: #2b2420;
    --line: #e4d8cc;
    --radius: 10px;
    --font: "Microsoft JhengHei", "PingFang TC", sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
  button { font: inherit; font-size: 14px; border: 0; border-radius: calc(var(--radius) / 2); padding: 7px 14px; cursor: pointer; background: var(--main); color: #fff; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.light { background: #fff; color: var(--main); border: 1px solid var(--line); }

  header { background: var(--main); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; flex: 1; }
  header button { background: rgba(255,255,255,.18); }

  main { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(280px, 1.2fr) 340px; gap: 20px; padding: 20px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } .phone { margin: 0 auto; } }
  @media (max-width: 420px) {
    main { padding: 10px; gap: 12px; }
    .box { padding: 14px; }
    .phone { width: min(320px, calc(100vw - 20px)); border-width: 8px; }
    .image-text-row { grid-template-columns: 1fr; }
  }

  .box { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .box h2 { margin: 0 0 6px; font-size: 16px; color: var(--main); }
  label { display: block; font-size: 14px; margin: 12px 0 4px; }
  input, textarea, select { width: 100%; padding: 8px 10px; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: calc(var(--radius) / 2); background: #fff; color: var(--text); }
  textarea { min-height: 70px; resize: vertical; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  /* 這篇的圖 */
  .pics { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .pics-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pics-head h2 { margin: 0; }
  .pic-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-top: 10px; }
  .pic-thumb { position: relative; aspect-ratio: 1; padding: 0; overflow: hidden; border: 3px solid transparent; background: #eee; border-radius: calc(var(--radius) / 2); }
  .pic-thumb.main { border-color: var(--main); }
  .pic-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .pic-del { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; padding: 0; border-radius: 50%; background: rgba(0,0,0,.72); line-height: 20px; }
  .storage { margin-top: 8px; white-space: pre-line; }
  .storage.full { color: #b42318; font-weight: bold; }
  .image-status { white-space: pre-wrap; margin-top: 8px; }
  .image-status.error { color: #b42318; }
  .image-text-controls { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .image-text-controls h3 { margin: 0 0 8px; font-size: 15px; color: var(--main); }
  .image-text-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .image-text-row label { margin-top: 8px; }

  /* 平台分頁 */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { background: #fff; color: var(--main); border: 1px solid var(--line); }
  .tabs button.on { background: var(--main); color: #fff; }
  #post { min-height: 340px; line-height: 1.7; }
  .count { font-size: 13px; color: #888; text-align: right; margin-top: 4px; }
  .helper { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .helper h2 { margin-bottom: 10px; }
  .helper-log { max-height: 220px; overflow-y: auto; display: grid; gap: 8px; margin-bottom: 10px; }
  .helper-msg { padding: 8px 10px; border-radius: calc(var(--radius) / 2); white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .helper-user { background: var(--bg); }
  .helper-ai { background: #f5f5f5; }
  .helper-input { display: flex; gap: 8px; margin-top: 8px; }
  .helper-input input { flex: 1; }
  .helper-input button { flex: none; }
  .helper-all { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 14px; }
  .helper-all input { width: auto; }
  .check-report { display: grid; gap: 4px; margin-top: 12px; }
  .check-line { padding: 7px 9px; border-radius: calc(var(--radius) / 2); white-space: pre-wrap; word-break: break-word; }
  .check-error { background: #fde8e7; color: #8a1c14; }
  .check-warning { background: #fff3cd; color: #6b5200; }

  /* 手機框 */
  .phone { width: 320px; height: 620px; border: 10px solid #111; border-radius: 36px; background: #fff; overflow-y: auto; align-self: start; font-size: 14px; }
  .p-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--main); flex: none; }
  .small { font-size: 12px; color: #888; }
  .p-text { padding: 0 12px 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .p-img { background: linear-gradient(135deg, var(--main), var(--bg)); display: flex; align-items: flex-end; width: 100%; overflow: hidden; }
  .p-img img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .p-img canvas { width: 100%; height: 100%; display: block; }
  .p-img span { margin: 12px; padding: 6px 12px; background: rgba(255,255,255,.9); border-radius: var(--radius); font-size: 18px; font-weight: bold; }
  .wide { aspect-ratio: 4 / 3; }
  .square { aspect-ratio: 1 / 1; }
  .empty { color: #aaa; }
  .fb-bar { display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #eee; color: #555; }
  .ig-bar { padding: 8px 12px; font-size: 18px; letter-spacing: 6px; }
  .ig-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .ig-carousel::-webkit-scrollbar { display: none; }
  .ig-slide { min-width: 100%; scroll-snap-align: start; scroll-snap-stop: always; background: #eee; }
  .ig-slide img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .ig-slide canvas { width: 100%; height: 100%; display: block; }
  .ig-dots { display: flex; justify-content: center; gap: 5px; padding: 7px 0 0; }
  .ig-dot { width: 6px; height: 6px; border-radius: 50%; background: #c7c7c7; }
  .ig-dot.on { background: var(--main); }
  .line-bg { background: #8fa9d4; min-height: 100%; padding: 12px; }
  .line-top { text-align: center; color: #fff; font-weight: bold; margin-bottom: 14px; }
  .line-row { display: flex; gap: 8px; align-items: flex-start; }
  .bubble { background: #fff; border-radius: 16px; padding: 10px 12px; white-space: pre-wrap; line-height: 1.6; max-width: 230px; word-break: break-word; }
  .line-stack { display: grid; gap: 8px; max-width: 230px; }
  .line-pic { border-radius: 16px; background: #fff; overflow: hidden; }
  .line-rich-menu { margin: 14px -12px -12px; background: #fff; }
  .line-menu-label { padding: 8px 12px; text-align: center; font-size: 12px; color: #555; border-top: 1px solid #ddd; }
  .line-rich-menu canvas { width: 100%; height: auto; display: block; }
  .th { display: flex; gap: 10px; padding: 14px 12px; }
  .th .p-text { padding: 4px 0 8px; }

  /* 跳出視窗 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.show { display: flex; }
  .modal .box { width: min(760px, 100%); max-height: 90vh; overflow: auto; }
  .modal textarea { min-height: 160px; }
  #mMenu .box { width: min(920px, 100%); }
  .menu-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .menu-cell-list { display: grid; gap: 8px; margin-top: 12px; }
  .menu-cell { display: grid; grid-template-columns: 44px 70px minmax(120px, 1fr) 130px minmax(160px, 1.3fr); gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: calc(var(--radius) / 2); }
  .menu-cell-code { align-self: center; text-align: center; font-size: 20px; font-weight: bold; color: var(--main); }
  .menu-cell label { margin: 0; }
  .menu-preview-wrap { margin-top: 14px; padding: 10px; background: var(--bg); border-radius: var(--radius); }
  #menuPreview { width: 100%; max-height: 360px; display: block; object-fit: contain; }
  .menu-status { margin-top: 8px; white-space: pre-wrap; }
  .menu-status.error { color: #b42318; font-weight: bold; }
  @media (max-width: 700px) {
    .menu-controls { grid-template-columns: 1fr; }
    .menu-cell { grid-template-columns: 38px 58px 1fr; }
    .menu-cell .menu-action, .menu-cell .menu-content { grid-column: 2 / -1; }
  }
  .item { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); padding: 8px 0; }
  .item div { flex: 1; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; display: none; z-index: 20; }
</style>
</head>
<body>

<header>
  <h1 id="brandTitle">我的品牌｜社群工作台</h1>
  <button id="btnNew">＋ 新的一篇</button>
  <button id="btnList">📁 我的貼文</button>
  <button id="btnMenu">📋 圖文選單</button>
  <button id="btnSet">⚙ 設定</button>
  <button id="btnAuth">🔐 登入</button>
</header>

<main>
  <!-- 左邊：素材卡 -->
  <section class="box">
    <h2>素材卡</h2>
    <div id="fields"></div>
    <label for="publishDate">📅 預計發佈日</label>
    <input type="date" id="publishDate">
    <div class="pics">
      <div class="pics-head"><h2>🖼 這篇的圖</h2><button type="button" id="btnUpload">📤 上傳</button></div>
      <input type="file" id="picInput" accept="image/*" multiple hidden>
      <label for="imagePrompt">圖片描述（要畫什麼）</label>
      <textarea id="imagePrompt" placeholder="例：暖色調的咖啡店窗邊，一杯手沖咖啡和午後陽光"></textarea>
      <div class="actions"><button type="button" id="btnGenerateImage">🎨 生圖</button><button type="button" id="btnDirectImage">🪄 AI 想圖再畫</button></div>
      <div class="small image-status" id="imageStatus"></div>
      <div class="pic-list" id="picList"></div>
      <div class="image-text-controls">
        <h3>加字</h3>
        <label for="imageText">圖上的字</label>
        <input type="text" id="imageText" placeholder="輸入要畫在主圖上的字">
        <div class="image-text-row">
          <div><label for="imageTextPosition">位置</label><select id="imageTextPosition"><option value="top">上</option><option value="middle">中</option><option value="bottom">下</option></select></div>
          <div><label for="imageTextSize">大小</label><select id="imageTextSize"><option value="small">小</option><option value="medium">中</option><option value="large">大</option></select></div>
          <div><label for="imageTextStyle">樣式</label><select id="imageTextStyle"><option value="white-main">白底主色字</option><option value="black-white">黑底白字</option><option value="white-shadow">白字陰影</option></select></div>
        </div>
        <label for="downloadSize">下載尺寸</label>
        <select id="downloadSize"></select>
        <div class="actions"><button type="button" id="btnDownloadImage">⬇ 下載這張圖</button></div>
      </div>
      <div class="small storage" id="storageUsage"></div>
    </div>
    <div class="actions">
      <button id="btnPrompt">🧩 組好指令</button>
      <button id="btnAI">✨ 讓 AI 寫</button>
      <button class="light" id="btnPaste">📥 貼回 AI 寫好的</button>
      <button class="light" id="btnSave">💾 存檔</button>
    </div>
    <div id="cloudSaveStatus" class="small" style="white-space:pre-wrap; margin-top:8px"></div>
    <div id="aiStatus" class="small" style="white-space:pre-wrap; margin-top:8px"></div>
  </section>

  <!-- 中間：平台分頁＋貼文框 -->
  <section class="box">
    <div class="tabs" id="tabs"></div>
    <textarea id="post" placeholder="把這個平台的貼文貼在這裡…"></textarea>
    <div class="count" id="count">0 字</div>
    <div class="actions"><button class="light" id="btnCopy">📋 複製這一篇</button><button class="light" id="btnUndo">↩ 復原上一版</button><button class="light" id="btnCheck">🔍 檢查官</button></div>
    <div class="helper">
      <h2>💬 AI 小幫手</h2>
      <div id="helperLog" class="helper-log"></div>
      <div class="actions" id="helperQuick">
        <button class="light" data-instruction="短一點">短一點</button>
        <button class="light" data-instruction="換開頭">換開頭</button>
        <button class="light" data-instruction="少一點 emoji">少一點 emoji</button>
        <button class="light" data-instruction="更像範例">更像範例</button>
      </div>
      <label class="helper-all"><input id="helperAllPlatforms" type="checkbox">三個平台一起改</label>
      <div class="helper-input"><input id="helperInput" type="text" placeholder="告訴 AI 想怎麼改…"><button id="btnHelperSend">送出</button></div>
      <div id="helperStatus" class="small" style="white-space:pre-wrap; margin-top:8px"></div>
    </div>
  </section>

  <!-- 右邊：手機預覽 -->
  <section class="phone" id="phone"></section>
</main>

<!-- 設定 -->
<div class="modal" id="mSet"><div class="box">
  <h2>⚙ 設定</h2>
  <label>品牌規格（把 品牌規格.md 整份貼進來）</label>
  <textarea id="setSpec" style="min-height:260px"></textarea>
  <label>檢查清單（可以不填）</label>
  <textarea id="setCheck"></textarea>
  <h3>第一組：OpenRouter</h3>
  <label for="setOpenRouterKey">AI 金鑰</label>
  <input type="password" id="setOpenRouterKey" autocomplete="off">
  <label for="setOpenRouterModel">模型</label>
  <select id="setOpenRouterModel">
    <optgroup label="DeepSeek">
      <option value="deepseek/deepseek-v4.1-flash">deepseek/deepseek-v4.1-flash</option>
      <option value="deepseek/deepseek-v4-pro">deepseek/deepseek-v4-pro</option>
      <option value="deepseek/deepseek-v3.2">deepseek/deepseek-v3.2</option>
    </optgroup>
    <optgroup label="Kimi">
      <option value="moonshotai/kimi-k2.6">moonshotai/kimi-k2.6</option>
      <option value="moonshotai/kimi-k2.5">moonshotai/kimi-k2.5</option>
      <option value="moonshotai/kimi-k3">moonshotai/kimi-k3</option>
    </optgroup>
    <optgroup label="MiniMax">
      <option value="minimax/minimax-m3">minimax/minimax-m3</option>
      <option value="minimax/minimax-m2.7">minimax/minimax-m2.7</option>
      <option value="minimax/minimax-m2.5">minimax/minimax-m2.5</option>
    </optgroup>
  </select>
  <label for="setOpenRouterCustomModel">或自己打模型名稱</label>
  <input type="text" id="setOpenRouterCustomModel" placeholder="有填就優先使用這個">
  <label for="setReasoning">思考</label>
  <select id="setReasoning">
    <option value="low">少想一點 low</option>
    <option value="medium">多想一點 medium</option>
    <option value="high">想很久 high</option>
  </select>
  <h3>生圖</h3>
  <label for="setImageSpec">圖片規格</label>
  <textarea id="setImageSpec" placeholder="例：寫實攝影、暖色調、留白乾淨，不要出現文字"></textarea>
  <label for="setImageModel">生圖模型</label>
  <select id="setImageModel">
    <option value="bytedance-seed/seedream-5-0-flash">bytedance-seed/seedream-5-0-flash</option>
    <option value="qwen/qwen-image-2.1-turbo">qwen/qwen-image-2.1-turbo</option>
    <option value="qwen/qwen-image-3">qwen/qwen-image-3</option>
    <option value="bytedance-seed/seedream-5-0-pro">bytedance-seed/seedream-5-0-pro</option>
    <option value="google/gemini-3.1-flash-lite-image">google/gemini-3.1-flash-lite-image</option>
  </select>
  <label for="setImageCustomModel">或自己打生圖模型名稱</label>
  <input type="text" id="setImageCustomModel" placeholder="有填就優先使用這個">
  <h3>第二組：Gemini</h3>
  <label for="setGeminiKey">Gemini 金鑰</label>
  <input type="password" id="setGeminiKey" autocomplete="off">
  <label for="setGeminiModel">Gemini 模型</label>
  <select id="setGeminiModel">
    <option value="gemini-3.8-flash">gemini-3.8-flash</option>
    <option value="gemini-3.6-flash">gemini-3.6-flash</option>
    <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
    <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
  </select>
  <h3>使用順序</h3>
  <label for="setProviderMode">先用哪一組</label>
  <select id="setProviderMode">
    <option value="fallback">先用 OpenRouter，失敗了自動換 Gemini</option>
    <option value="gemini">只用 Gemini</option>
    <option value="openrouter">只用 OpenRouter</option>
  </select>
  <div class="actions"><button id="btnSetSave">儲存</button><button class="light" data-close>關閉</button></div>
</div></div>

<!-- 組好的指令 -->
<div class="modal" id="mPrompt"><div class="box">
  <h2>🧩 組好的指令</h2>
  <p class="small">按「複製」，貼到 Codex 新對話（或 ChatGPT）。寫好以後，按「📥 貼回 AI 寫好的」。</p>
  <textarea id="promptText" style="min-height:360px" readonly></textarea>
  <div class="actions"><button id="btnPromptCopy">複製</button><button class="light" data-close>關閉</button></div>
</div></div>

<!-- 貼回 -->
<div class="modal" id="mPaste"><div class="box">
  <h2>📥 貼回 AI 寫好的</h2>
  <p class="small">把 AI 的回覆整段貼進來，它會照【平台】的標題，自動分到每個分頁。</p>
  <textarea id="pasteText" style="min-height:300px"></textarea>
  <div class="actions"><button id="btnPasteGo">分到各平台</button><button class="light" data-close>關閉</button></div>
  <div id="pasteAsk" class="small" style="white-space:pre-wrap"></div>
</div></div>

<!-- 我的貼文 -->
<div class="modal" id="mList"><div class="box">
  <h2>📁 我的貼文</h2>
  <div class="actions">
    <button id="btnUploadAll">⬆ 全部上傳到雲端</button>
    <button class="light" id="btnDownloadAll">⬇ 從雲端拿回來</button>
  </div>
  <div id="cloudSyncStatus" class="small" style="margin:10px 0;white-space:pre-wrap"></div>
  <div id="list"></div>
  <div class="actions"><button class="light" data-close>關閉</button></div>
</div></div>

<!-- 檢查報告 -->
<div class="modal" id="mCheck"><div class="box">
  <h2>🔍 檢查報告</h2>
  <div id="checkMeta" class="small" style="white-space:pre-wrap"></div>
  <div id="checkReport" class="check-report"></div>
  <div class="actions"><button class="light" data-close>關閉</button></div>
</div></div>

<!-- LINE 圖文選單 -->
<div class="modal" id="mMenu"><div class="box">
  <h2>📋 LINE 圖文選單</h2>
  <div class="menu-controls">
    <div><label for="menuTemplate">版型</label><select id="menuTemplate"></select></div>
    <div><label for="menuBackground">底色</label><select id="menuBackground"><option value="main">品牌主色</option><option value="white">白色</option><option value="image">這篇的主圖加深一點</option></select></div>
    <div><label for="menuBarText">選單列的字</label><input type="text" id="menuBarText" maxlength="14" value="選單"></div>
  </div>
  <div class="menu-cell-list" id="menuCells"></div>
  <div class="menu-preview-wrap"><canvas id="menuPreview"></canvas></div>
  <div class="small menu-status" id="menuStatus"></div>
  <div class="actions"><button id="btnDownloadMenu">⬇ 下載選單圖</button><button class="light" id="btnCopyMenu">📋 複製設定表</button><button class="light" data-close>關閉</button></div>
</div></div>

<!-- Supabase 登入 -->
<div class="modal" id="mAuth"><div class="box">
  <h2>🔐 登入</h2>
  <label for="authEmail">Email</label>
  <input type="email" id="authEmail" autocomplete="email" placeholder="name@example.com">
  <label for="authPassword">密碼（至少 6 個字）</label>
  <input type="password" id="authPassword" minlength="6" autocomplete="current-password">
  <div class="actions"><button id="btnSignIn">登入</button><button id="btnSignUp">第一次：註冊</button><button class="light" id="btnSignOut">登出</button><button class="light" data-close>關閉</button></div>
  <div id="authStatus" class="small" style="margin-top:10px;white-space:pre-wrap"></div>
</div></div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== 我的品牌、平台、欄位都在這裡改 =====

  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  let storageFull = false;
  let warehouseError = '';
  let imageWarehouseReady = false;
  let imageDbPromise = null;

  function openImageDb() {
    if (!imageDbPromise) imageDbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(IMAGE_DB, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(IMAGE_STORE)) db.createObjectStore(IMAGE_STORE);
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('圖片倉庫打不開'));
      request.onblocked = () => reject(new Error('圖片倉庫被其他分頁擋住'));
    });
    return imageDbPromise;
  }

  async function imageStoreRequest(mode, action) {
    const db = await openImageDb();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(IMAGE_STORE, mode);
      const store = transaction.objectStore(IMAGE_STORE);
      let request;
      try { request = action(store); } catch (error) { reject(error); return; }
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('圖片倉庫操作失敗'));
      transaction.onabort = () => reject(transaction.error || new Error('圖片倉庫操作失敗'));
    });
  }

  const putStoredImage = (id, dataUrl) => imageStoreRequest('readwrite', store => store.put(dataUrl, id));
  const getStoredImage = id => imageStoreRequest('readonly', store => store.get(id));
  const deleteStoredImage = id => imageStoreRequest('readwrite', store => store.delete(id));
  const countStoredImages = () => imageStoreRequest('readonly', store => store.count());
  const clearStoredImages = () => imageStoreRequest('readwrite', store => store.clear());

  const store = (k, v) => {
    try { localStorage.setItem(k, JSON.stringify(v)); storageFull = false; renderStorageUsage(); return true; }
    catch (e) { storageFull = true; renderStorageUsage(); return false; }
  };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const toast = msg => { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1600); };

  let sb = null;
  let sbUnavailableReason = '';
  let localReady = false;
  const autoSyncedUserIds = new Set();
  const cloudPostIds = new Set();

  if (!SB_URL || !SB_KEY) {
    sbUnavailableReason = '還沒填 SB_URL 或 SB_KEY';
  } else if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    sbUnavailableReason = 'Supabase 程式庫載入失敗';
  } else {
    try {
      sb = window.supabase.createClient(SB_URL, SB_KEY);
    } catch (error) {
      sbUnavailableReason = error?.message || 'Supabase 連線設定無效';
    }
  }

  function authErrorZh(error) {
    const message = String(error?.message || error || '發生未知錯誤');
    const lower = message.toLowerCase();
    if (lower.includes('invalid login credentials')) return 'Email 或密碼不對';
    if (lower.includes('user already registered')) return '這個 Email 註冊過了，直接按「登入」';
    if (lower.includes('email not confirmed')) return '到 Supabase 把 Confirm email 關掉';
    if (lower.includes('password') && (lower.includes('6') || lower.includes('short') || lower.includes('least'))) return '密碼至少 6 個字';
    if (lower.includes('rate limit') || lower.includes('too many requests') || lower.includes('over_email_send_rate_limit')) return '試太多次了，等 1 分鐘';
    return message;
  }

  function setAuthStatus(message) {
    $('authStatus').textContent = message;
  }

  function refreshAuthUI() {
    $('btnAuth').textContent = me?.email ? `☁ ${me.email}` : '🔐 登入';
    $('btnSignOut').disabled = !me;
    if ($('mList').classList.contains('show')) showList();
  }

  function authInputs() {
    return { email: $('authEmail').value.trim(), password: $('authPassword').value };
  }

  function authReady() {
    if (sb) return true;
    setAuthStatus(`還沒接雲端：${sbUnavailableReason || '未知原因'}`);
    return false;
  }

  async function initializeAuth() {
    refreshAuthUI();
    if (!sb) return;
    sb.auth.onAuthStateChange((_event, session) => {
      me = session?.user || null;
      refreshAuthUI();
      maybeAutoDownload();
    });
    try {
      const { data, error } = await sb.auth.getSession();
      if (error) throw error;
      me = data.session?.user || null;
      refreshAuthUI();
      maybeAutoDownload();
    } catch (error) {
      setAuthStatus(authErrorZh(error));
    }
  }

  // 示範用：第一次打開，先把小島的品牌規格放進設定
  if (!localStorage.getItem(K_SET)) store(K_SET, { spec: "## 1. 品牌口氣（寫具體）\n\n像島哥本人跟熟客聊天。具體來說：\n\n- 句子短，一句只講一件事。\n- 用「你」，不用「您」、不用「親愛的」。\n- 驚嘆號一篇最多 1 個。\n- 講豆子：講「味道」和「故事」，不講便宜、不催人買。\n- 不寫「快來」「要買要快」「錯過可惜」這種催促的話。\n- 「慢慢來，比較快。」可以用，但一篇最多一次，不是每篇都要。\n\n## 2. 不能用的字\n\n- 網美風誇張字：爆表、必喝、神級、太狂、一定要衝、狂歡、史上最\n- 講便宜的字：CP 值、超划算、俗又大碗\n- 大賣場用語：「咖啡豆產品」→ 一律說「豆子」\n\n## 3. 不准自己加的東西\n\n老闆沒說過的，**一個字都不要加**：\n\n- 豆子的產地細節（海拔、農場、處理法、烘焙度）\n- 老闆沒說的風味和口感\n- 老闆沒說的活動規則（例如「限開賣當天」「預購也算名額」）\n- 「神秘驚喜」「限時倒數」這種製造緊張的話\n\n不確定的，先問我，不要猜。\n\n## 4. 三個平台的規則＋骨架＋範例\n\n### Facebook\n\n- 看的人：熟客、年紀比較大。\n- 4～6 段，每段 1～3 句。先講一個小故事或店裡的畫面，再講活動。\n- emoji 最多 2 個。\n- 不放 hashtag。\n\n**骨架（照這個格子填）：**\n\n```\n【小島日常】或【島哥的＿＿＿通知】\n（第 1 段：店裡的一個小畫面，1～2 句）\n（第 2 段：島哥說的話或想法，1～2 句）\n（第 3 段：活動是什麼、哪一天、多少錢）\n（第 4 段：優惠和條件，寫清楚誰可以、要做什麼）\n（可選：慢慢來，比較快。）\n\n📍 小島咖啡｜台中市西區小島巷 8 號\n週三～週日 11:00–19:00\n```\n\n**範例（照這篇的感覺寫）：**\n\n```\n【小島日常】\n這週烘了一批哥倫比亞，豆子在烘豆機裡慢慢轉，整間店都是焦糖的味道。\n\n島哥說，烘豆跟做人一樣，急不得。\n這批豆子要休息三天才會好喝，所以下週三才會上架。\n\n慢慢來，比較快。\n\n📍 小島咖啡｜台中市西區小島巷 8 號\n週三～週日 11:00–19:00\n```\n\n### Instagram\n\n- 看的人：年輕人，先看照片。\n- 整篇不超過 8 行（hashtag 不算）。一行一件事。\n- 用「.」空行分段。\n- 一定要 tag `@xiaodao.coffee`。\n- hashtag 5～8 個，放最後，一定包含：#小島咖啡 #台中咖啡 #自家烘焙\n\n**骨架：**\n\n```\n（第 1 行：一句短話＋1 個 emoji）\n\n（2～4 行：名稱、味道或重點，一行一件事）\n.\n（日期／時間）\n.\n@xiaodao.coffee\n#小島咖啡 #台中咖啡 #自家烘焙 ＋2～5 個這次活動的 hashtag\n```\n\n**範例：**\n\n```\n下週三見 ☕\n\n哥倫比亞 慧蘭 新烘好\n焦糖、堅果、一點點紅蘋果\n.\n慢慢來，比較快。\n.\n@xiaodao.coffee\n#小島咖啡 #台中咖啡 #自家烘焙 #手沖咖啡 #慢慢來\n```\n\n### LINE 官方帳號\n\n- 看的人：會員，想知道優惠。\n- 整篇在手機一個畫面內看完（大約 8 行內）。\n- 第一行就講好處。\n- ✔ 重點最多 3 點。\n- 一定要寫「怎麼做」。\n- 最後一行固定署名。\n\n**骨架：**\n\n```\n【會員限定】＋一句好處　（優惠用這個）\n【小島公告】＋一句重點　（營業時間、公告用這個）\n\n✔ 重點 1\n✔ 重點 2\n✔ 重點 3（最多 3 點）\n\n👉 （怎麼做，例如：直接回覆「＿＿」）\n\n小島咖啡 島哥\n```\n\n**範例：**\n\n```\n【會員限定】哥倫比亞新豆預購開始囉！\n\n✔ 會員預購 9 折\n✔ 下週三起到店取豆\n\n👉 直接回覆「預購＋數量」就可以\n\n小島咖啡 島哥\n```\n\n## 5. 平台限定的規則（寫具體）\n\n- 老闆說「只在 LINE 講」的，**不寫到 FB、IG**。\n- 老闆說「先不要講」「還沒確定」的，**三篇都不寫**。\n- 會員活動如果老闆說「三個平台都要」，FB、IG 也要寫，結尾加一句「還不是會員的，可以加小島的 LINE」。\n\n## 6. 寫之前一定要檢查\n\n- 價格、日期以老闆**最後一次**說的為準。\n- 日期後面寫星期幾，要對（例：10/10 是週六）。\n- 營業時間有變的（提早關、開比較晚），要寫清楚。", check: "> 卡住的同學，把這份改名成 `檢查清單.md` 放進資料夾。\n\n## 事實（拿活動卡來對）\n\n1. 價格、日期、星期幾、時間，跟活動卡一模一樣嗎？\n2. 有沒有活動卡上沒有的東西？（產地細節、風味、口感、規則、名額、驚喜）有的話刪掉。\n3. 優惠的條件寫對了嗎？（誰可以、要買什麼才有、送幾個、限量多少）\n4. 老闆改過口的地方，用的是最後的版本嗎？\n\n## 平台\n\n5. 「只能在 LINE 講」的事，有沒有跑到 FB、IG？\n6. 「先不要講」的事，三篇都沒有出現嗎？\n7. 每個平台的固定結尾都有嗎？（FB：地址＋營業時間／IG：tag＋hashtag／LINE：署名）\n\n## 口氣\n\n8. 有沒有不能用的字？（品牌規格裡的＋這次老闆新說不要的）\n9. 有沒有催人買的話？（快來、要買要快、錯過可惜）\n10. 讀起來像島哥嗎？還是像百貨公司、像網美？\n\n## 檢查完\n\n- 每篇每條都寫 ✅ 或 ❌。\n- 有 ❌ 的，先自己改好，再給我看：檢查結果＋改了哪裡。" });

  document.title = BRAND.name + '｜社群工作台';
  $('brandTitle').textContent = BRAND.name + '｜社群工作台';

  const blank = () => ({ id: null, fields: {}, posts: {}, chats: {}, previousPosts: null, images: [], primaryImageId: null, imageText: { text: '', position: 'bottom', size: 'medium', style: 'white-main' }, downloadSize: 'platform', publishDate: '', tab: PLATFORMS[0] });
  let cur = blank();

  function imageIdsFrom(record) {
    if (Array.isArray(record?.imageIds)) return record.imageIds.map(String);
    if (!Array.isArray(record?.images)) return [];
    return record.images.map(image => typeof image === 'string' ? image : image?.id).filter(Boolean).map(String);
  }

  function persistableRecord(record) {
    const { images, ...rest } = record;
    return { ...rest, imageIds: (images || []).map(image => String(image.id)) };
  }

  function storeDraft() {
    return store(K_DRAFT, imageWarehouseReady ? persistableRecord(cur) : { ...cur, images: cur.images.map(image => ({ ...image })) });
  }

  function normalizeCur(record, images = []) {
    const next = { ...blank(), ...(record || {}) };
    next.fields = next.fields || {};
    next.posts = next.posts || {};
    next.chats = next.chats || {};
    next.previousPosts = next.previousPosts || null;
    next.images = images.map(image => ({ ...image, id: String(image.id) }));
    next.primaryImageId = next.primaryImageId ? String(next.primaryImageId) : (next.images[0] && next.images[0].id) || null;
    next.imageText = { text: '', position: 'bottom', size: 'medium', style: 'white-main', ...(next.imageText || {}) };
    next.downloadSize = next.downloadSize || 'platform';
    if (!PLATFORMS.includes(next.tab)) next.tab = PLATFORMS[0];
    delete next.imageIds;
    return next;
  }

  async function hydrateRecord(record) {
    const ids = imageIdsFrom(record);
    const images = (await Promise.all(ids.map(async id => ({ id, dataUrl: await getStoredImage(id) })))).filter(image => image.dataUrl);
    return normalizeCur(record, images);
  }

  async function migrateRecord(record) {
    if (!record) return record;
    const legacyImages = Array.isArray(record.images) ? record.images.filter(image => image && typeof image === 'object' && image.id && image.dataUrl) : [];
    for (const image of legacyImages) await putStoredImage(String(image.id), image.dataUrl);
    const { images, ...rest } = record;
    return { ...rest, imageIds: imageIdsFrom(record) };
  }

  async function migrateLegacyImages() {
    const draft = load(K_DRAFT, null);
    const posts = load(K_POSTS, []);
    const migratedDraft = await migrateRecord(draft);
    const migratedPosts = await Promise.all(posts.map(migrateRecord));
    if (migratedDraft) store(K_DRAFT, migratedDraft);
    store(K_POSTS, migratedPosts);
    return migratedDraft;
  }

  // 素材卡表單
  $('fields').innerHTML = FIELDS.map(f => {
    const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
    const input = f.type === 'textarea'
      ? `<textarea id="f_${f.id}"${ph}></textarea>`
      : `<input type="${f.type}" id="f_${f.id}"${ph}>`;
    return `<label for="f_${f.id}">${esc(f.label)}</label>${input}`;
  }).join('');

  // 平台分頁
  $('tabs').innerHTML = PLATFORMS.map(p => `<button data-p="${p}">${p}</button>`).join('');
  $('tabs').onclick = e => { const p = e.target.dataset.p; if (p) { cur.tab = p; fill(); } };

  // 日期加星期幾：2026-10-15 → 2026/10/15（四）
  function dateText(v) {
    if (!v) return '';
    const [y, m, d] = v.split('-').map(Number);
    return `${y}/${m}/${d}（${'日一二三四五六'[new Date(y, m - 1, d).getDay()]}）`;
  }
  const topic = () => {
    const f = FIELDS.find(f => f.type !== 'date');
    return f ? (cur.fields[f.id] || '').trim() : '';
  };

  function localStorageBytes() {
    let chars = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i) || '';
      chars += key.length + (localStorage.getItem(key) || '').length;
    }
    return chars * 2;
  }

  function renderStorageUsage() {
    const el = $('storageUsage');
    if (!el) return;
    if (storageFull) {
      el.classList.add('full');
      el.textContent = '⚠️ 抽屜滿了，剛剛的沒存到！';
      return;
    }
    Promise.all([
      countStoredImages(),
      navigator.storage?.estimate ? navigator.storage.estimate() : Promise.resolve(null)
    ]).then(([count, estimate]) => {
      el.classList.toggle('full', Boolean(warehouseError));
      const siteMb = estimate && Number.isFinite(estimate.usage) ? `${(estimate.usage / 1024 / 1024).toFixed(2)} MB` : '無法估算';
      el.textContent = `瀏覽器的抽屜：已用 ${(localStorageBytes() / 1024 / 1024).toFixed(2)} MB\n圖片倉庫：${count} 張，這個網站約用 ${siteMb}${warehouseError ? `\n⚠️ ${warehouseError}` : ''}`;
    }).catch(() => {
      el.classList.add('full');
      el.textContent = `瀏覽器的抽屜：已用 ${(localStorageBytes() / 1024 / 1024).toFixed(2)} MB\n⚠️ 圖片倉庫暫時無法讀取`;
    });
  }

  $('downloadSize').innerHTML = Object.entries(SIZES).map(([key, size]) => `<option value="${key}">${esc(size.label)}${size.width ? ` ${size.width}×${size.height}` : ''}</option>`).join('');

  const primaryImage = () => cur.images.find(pic => pic.id === cur.primaryImageId) || cur.images[0] || null;
  const imageCache = new Map();
  function loadCanvasImage(dataUrl) {
    if (!imageCache.has(dataUrl)) imageCache.set(dataUrl, new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('圖片格式無法處理'));
      image.src = dataUrl;
    }));
    return imageCache.get(dataUrl);
  }

  const menuTemplate = id => MENUS.find(menu => menu.id === id) || MENUS[0];
  const blankMenuCell = () => ({ icon: '', label: '', action: 'none', content: '' });
  const blankMenu = () => ({ templateId: MENUS[0].id, background: 'main', backgroundImageId: null, barText: '選單', cells: Array.from({ length: MENUS[0].cols * MENUS[0].rows }, blankMenuCell) });
  function normalizeMenu(value) {
    const source = value || blankMenu();
    const template = menuTemplate(source.templateId);
    const count = template.cols * template.rows;
    return {
      templateId: template.id,
      background: ['main', 'white', 'image'].includes(source.background) ? source.background : 'main',
      backgroundImageId: source.backgroundImageId ? String(source.backgroundImageId) : null,
      barText: String(source.barText || '選單').slice(0, 14),
      cells: Array.from({ length: count }, (_, index) => ({ ...blankMenuCell(), ...(source.cells?.[index] || {}) }))
    };
  }
  let menuConfig = normalizeMenu(load(K_MENU, blankMenu()));

  const firstGrapheme = value => {
    const text = String(value || '');
    if (!text) return '';
    if (Intl.Segmenter) return [...new Intl.Segmenter('zh-TW', { granularity: 'grapheme' }).segment(text)][0]?.segment || '';
    return Array.from(text)[0] || '';
  };

  function saveMenu() {
    store(K_MENU, menuConfig);
    renderMenuPreview();
    if (cur.tab === 'LINE') preview();
  }

  function menuPositionName(template, index) {
    if (template.rows === 1) {
      if (template.cols === 1) return '全區';
      return template.cols === 2 ? ['左', '右'][index] : ['左', '中', '右'][index];
    }
    const colNames = template.cols === 2 ? ['左', '右'] : ['左', '中', '右'];
    const rowName = Math.floor(index / template.cols) === 0 ? '上' : '下';
    return `${colNames[index % template.cols]}${rowName}`;
  }

  function menuErrors(config = menuConfig) {
    const errors = [];
    if (config.cells.every(cell => cell.action === 'none')) errors.push('LINE 不允許每一格都設為「不設定」');
    config.cells.forEach((cell, index) => {
      const code = String.fromCharCode(65 + index);
      if (!(cell.icon || '').trim() && !(cell.label || '').trim()) errors.push(`${code} 格至少要有文字或圖示`);
      const effective = (cell.content || '').trim() || (cell.label || '').trim();
      if (cell.action === 'url' && !effective.startsWith('https://')) errors.push(`${code} 格的網址必須以 https:// 開頭`);
    });
    if (config.background === 'image' && !config.backgroundImageId) errors.push('請先替這一篇選一張主圖，再使用主圖底色');
    return errors;
  }

  function setMenuStatus(message = '', isError = false) {
    const el = $('menuStatus');
    el.textContent = message;
    el.classList.toggle('error', isError);
  }

  async function menuBackgroundData(config = menuConfig) {
    if (config.background !== 'image' || !config.backgroundImageId) return null;
    const current = cur.images.find(image => String(image.id) === String(config.backgroundImageId));
    return current?.dataUrl || await getStoredImage(String(config.backgroundImageId)) || null;
  }

  async function drawMenuCanvas(canvas, config, width, height) {
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    const template = menuTemplate(config.templateId);
    const mainColor = getComputedStyle(document.documentElement).getPropertyValue('--main').trim() || '#8a5a3b';
    ctx.fillStyle = config.background === 'white' ? '#fff' : mainColor;
    ctx.fillRect(0, 0, width, height);
    if (config.background === 'image') {
      const dataUrl = await menuBackgroundData(config);
      if (!dataUrl) throw new Error('找不到圖文選單使用的主圖');
      const image = await loadCanvasImage(dataUrl);
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const sourceWidth = width / scale, sourceHeight = height / scale;
      ctx.drawImage(image, (image.naturalWidth - sourceWidth) / 2, (image.naturalHeight - sourceHeight) / 2, sourceWidth, sourceHeight, 0, 0, width, height);
      ctx.fillStyle = 'rgba(0,0,0,.42)';
      ctx.fillRect(0, 0, width, height);
    }
    const dark = config.background !== 'white';
    const cellWidth = width / template.cols, cellHeight = height / template.rows;
    ctx.strokeStyle = dark ? 'rgba(255,255,255,.72)' : 'rgba(138,90,59,.45)';
    ctx.lineWidth = Math.max(1, width / 1250);
    for (let col = 1; col < template.cols; col++) { ctx.beginPath(); ctx.moveTo(cellWidth * col, 0); ctx.lineTo(cellWidth * col, height); ctx.stroke(); }
    for (let row = 1; row < template.rows; row++) { ctx.beginPath(); ctx.moveTo(0, cellHeight * row); ctx.lineTo(width, cellHeight * row); ctx.stroke(); }
    const fontFamily = getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = dark ? '#fff' : mainColor;
    config.cells.forEach((cell, index) => {
      const col = index % template.cols, row = Math.floor(index / template.cols);
      const centerX = (col + .5) * cellWidth, centerY = (row + .5) * cellHeight;
      const shortSide = Math.min(cellWidth, cellHeight);
      const icon = (cell.icon || '').trim(), label = (cell.label || '').trim();
      const iconSize = Math.round(shortSide * (label ? .22 : .3));
      const textSize = Math.round(shortSide * (icon ? .105 : .13));
      if (icon) {
        ctx.font = `${iconSize}px "Segoe UI Emoji", ${fontFamily}`;
        ctx.fillText(icon, centerX, label ? centerY - shortSide * .13 : centerY);
      }
      if (label) {
        ctx.font = `bold ${textSize}px ${fontFamily}`;
        const lines = wrapCanvasText(ctx, label, cellWidth * .78, 2);
        const lineHeight = textSize * 1.25;
        const baseY = icon ? centerY + shortSide * .18 : centerY;
        lines.forEach((line, lineIndex) => ctx.fillText(line, centerX, baseY + (lineIndex - (lines.length - 1) / 2) * lineHeight));
      }
    });
    return canvas;
  }

  function renderMenuCells() {
    const template = menuTemplate(menuConfig.templateId);
    $('menuCells').innerHTML = menuConfig.cells.map((cell, index) => {
      const code = String.fromCharCode(65 + index);
      return `<div class="menu-cell" data-menu-index="${index}">

        <label>圖示<input class="menu-icon" type="text" value="${esc(cell.icon || '')}" placeholder="☕"></label>
        <label>格子上的字<input class="menu-label" type="text" maxlength="12" value="${esc(cell.label || '')}"></label>
        <label class="menu-action">按了做什麼<select><option value="text"${cell.action === 'text' ? ' selected' : ''}>送出文字</option><option value="url"${cell.action === 'url' ? ' selected' : ''}>開網址</option><option value="none"${cell.action === 'none' ? ' selected' : ''}>不設定</option></select></label>
        <label class="menu-content">內容<input type="text" value="${esc(cell.content || '')}" placeholder="沒填就使用格子上的字"></label>
      </div>`;
    }).join('');

  async function renderMenuPreview() {
    if (!$('menuPreview')) return;

  function menuSettingsText() {
    const template = menuTemplate(menuConfig.templateId);
    const rows = [`版型：${template.name} ${template.w}×${template.h}`, `選單列的字：${menuConfig.barText || '選單'}`];
    menuConfig.cells.forEach((cell, index) => {
      const code = String.fromCharCode(65 + index);
      const position = menuPositionName(template, index);
      const icon = (cell.icon || '').trim();
      const label = (cell.label || '').trim();
      const effective = (cell.content || '').trim() || label;
      const action = cell.action === 'text' ? `文字「${effective}」` : cell.action === 'url' ? `網址「${effective}」` : '不設定';
      rows.push(`${code}（${position}）${icon ? icon + ' ' : ''}${label} → ${action}`);
    });
    return rows.join('\n');
  }

  function roundedRect(ctx, x, y, width, height, radius) {
    const r = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
  }

  function wrapCanvasText(ctx, text, maxWidth, maxLines = 3) {
    const chars = Array.from(String(text || '').trim());
    const lines = [];
    let line = '';
    let overflow = false;
    for (const char of chars) {
      if (char === '\n') {
        lines.push(line); line = '';
      } else if (!line || ctx.measureText(line + char).width <= maxWidth) {
        line += char;
      } else {
        lines.push(line); line = char;
      }
      if (lines.length === maxLines) { overflow = true; break; }
    }
    if (!overflow && line) lines.push(line);
    const result = lines.slice(0, maxLines);
    if (overflow && result.length) {
      let last = result[result.length - 1];
      while (last && ctx.measureText(last + '…').width > maxWidth) last = last.slice(0, -1);
      result[result.length - 1] = last + '…';
    }
    return result;
  }

  async function composeImage(canvas, dataUrl, width, height, settings = cur.imageText) {
    const image = await loadCanvasImage(dataUrl);
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
    const sourceWidth = width / scale, sourceHeight = height / scale;
    const sourceX = (image.naturalWidth - sourceWidth) / 2;
    const sourceY = (image.naturalHeight - sourceHeight) / 2;
    ctx.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, width, height);
    const text = (settings.text || '').trim();
    if (!text) return canvas;

    const sizeRatio = { small: .045, medium: .065, large: .085 }[settings.size] || .065;
    const fontSize = Math.round(width * sizeRatio);
    const fontFamily = getComputedStyle(document.body).fontFamily;
    ctx.font = `bold ${fontSize}px ${fontFamily}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const maxTextWidth = width * .84;
    const lines = wrapCanvasText(ctx, text, maxTextWidth, 3);
    const lineHeight = fontSize * 1.3;
    const paddingX = fontSize * .6, paddingY = fontSize * .4;
    const textWidth = Math.max(...lines.map(line => ctx.measureText(line).width));
    const boxWidth = textWidth + paddingX * 2;
    const boxHeight = lines.length * lineHeight + paddingY * 2;
    const centerY = settings.position === 'top' ? height * .16 + boxHeight / 2
      : settings.position === 'middle' ? height / 2
      : height * .84 - boxHeight / 2;
    const boxX = (width - boxWidth) / 2, boxY = centerY - boxHeight / 2;
    const mainColor = getComputedStyle(document.documentElement).getPropertyValue('--main').trim() || '#8a5a3b';

    ctx.save();
    if (settings.style === 'white-main' || settings.style === 'black-white') {
      ctx.fillStyle = settings.style === 'white-main' ? 'rgba(255,255,255,.86)' : 'rgba(0,0,0,.72)';
      roundedRect(ctx, boxX, boxY, boxWidth, boxHeight, fontSize * .28);
      ctx.fill();
    }
    ctx.fillStyle = settings.style === 'white-main' ? mainColor : '#fff';
    if (settings.style === 'white-shadow') {
      ctx.shadowColor = 'rgba(0,0,0,.85)';
      ctx.shadowBlur = fontSize * .18;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = fontSize * .08;
    }
    lines.forEach((line, index) => {
      const y = centerY + (index - (lines.length - 1) / 2) * lineHeight;
      ctx.fillText(line, width / 2, y);
    });
    ctx.restore();
    return canvas;
  }

  function composedCanvas(platform) {
    return `<canvas class="composed-pic" data-compose-platform="${platform}" role="img" aria-label="加好字的主圖"></canvas>`;
  }

  function drawPreviewCanvases() {

  const picHtml = platform => {

  const picBox = (platform, extraClass = '') => {

    return `<div class="p-img ${extraClass}" style="aspect-ratio:${w}/${h}">${image}</div>`;
  };
  const igCarousel = () => {
    const main = primaryImage();
    if (!main) return '';
    const ordered = [main, ...cur.images.filter(pic => pic.id !== main.id)];
    const [w, h] = PIC_SIZE.IG;
    const slides = ordered.map((pic, i) => `<div class="ig-slide" style="aspect-ratio:${w}/${h}">${i === 0 ? composedCanvas('IG') : `<img src="${pic.dataUrl}" alt="這篇的第 ${i + 1} 張圖">`}</div>`).join('');
    const dots = ordered.map((pic, i) => `<span class="ig-dot${i === 0 ? ' on' : ''}"></span>`).join('');
    return `<div class="ig-carousel" aria-label="這篇的圖片，可左右滑動">${slides}</div><div class="ig-dots" aria-hidden="true">${dots}</div>`;
  };

  function renderPics() {
    $('picList').innerHTML = cur.images.map(pic => `<div class="pic-thumb${pic.id === cur.primaryImageId ? ' main' : ''}" data-pic="${esc(String(pic.id))}" role="button" tabindex="0" title="設為主圖">
      <img src="${pic.dataUrl}" alt="上傳的圖片">
      <button type="button" class="pic-del" data-del-pic="${esc(String(pic.id))}" aria-label="刪除圖片">×</button>
    </div>`).join('');
    renderStorageUsage();
  }

  function resizeDataUrl(dataUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onerror = () => reject(new Error('圖片格式無法處理'));
      img.onload = () => {
        const scale = Math.min(1, 1080 / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = dataUrl;
    });
  }

  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('讀不到圖片'));
      reader.onload = async () => {
        try { resolve(await resizeDataUrl(reader.result)); }
        catch (error) { reject(error); }
      };
      reader.readAsDataURL(file);
    });
  }

  // 手機預覽

            <div class="line-rich-menu"><div class="line-menu-label">${esc(menuConfig.barText || '選單')} ▾</div><canvas id="lineMenuCanvas"></canvas></div></div>`,
      Threads: `<div class="th"><div class="avatar"></div><div><b>${acc}</b> <span class="small">剛剛</span>
            <div class="p-text">${text}</div>${picBox('Threads')}<div class="small">♡ 💬 🔁 ➤</div></div></div>`
    };

  // 把資料放回畫面
  function fill(persist = true) {

  $('btnDownloadImage').onclick = async () => {
    const pic = primaryImage();
    if (!pic) { toast('先上傳或生一張圖'); return; }
    const button = $('btnDownloadImage');
    const selected = SIZES[cur.downloadSize] || SIZES.platform;
    const platformSize = PIC_SIZE[cur.tab] || PIC_SIZE.FB;
    const width = selected.width || platformSize[0];
    const height = selected.height || platformSize[1];
    const sizeName = cur.downloadSize === 'platform' ? cur.tab : selected.label;

  $('btnUpload').onclick = () => $('picInput').click();
  $('picInput').onchange = async e => {
    const files = [...e.target.files];
    e.target.value = '';
    if (!files.length) return;
    const oldImages = [...cur.images], oldPrimary = cur.primaryImageId;
    try {
      const dataUrls = await Promise.all(files.map(resizeImage));
      const stamp = Date.now();
      const added = dataUrls.map((dataUrl, i) => ({ id: `${stamp}-${i}`, dataUrl }));
      await Promise.all(added.map(image => putStoredImage(image.id, image.dataUrl)));
      cur.images.push(...added);
      if (!cur.primaryImageId) cur.primaryImageId = added[0].id;
      if (!storeDraft()) {
        cur.images = oldImages; cur.primaryImageId = oldPrimary;
        await Promise.allSettled(added.map(image => deleteStoredImage(image.id)));

  function imageError(status) {
    return ({
      400: '這個模型不接受這個要求，換一個生圖模型試試',
      401: '金鑰不對',
      402: '全班的額度用完了',
      404: '生圖模型名稱打錯了',
      429: '太多人同時在用',
      502: '這張沒畫完（沒有扣錢），再按一次'
    })[status] || `生圖失敗（HTTP ${status}）`;
  }

  function aspectRatioFor(platform) {
    const [width, height] = PIC_SIZE[platform] || PIC_SIZE.FB;
    const gcd = (a, b) => b ? gcd(b, a % b) : a;
    const divisor = gcd(width, height);
    return `${width / divisor}:${height / divisor}`;
  }

  async function generateImage(prompt) {
    const settings = load(K_SET, {});
    const key = (settings.openRouterKey || settings.apiKey || '').trim();
    if (!key) {
      throw new Error('生圖要用第一組 OpenRouter 的金鑰（Gemini 的免費金鑰不能生圖）。先用 📤 上傳。');
    }
    const model = (settings.imageCustomModel || '').trim() || settings.imageModel || DEFAULT_IMAGE_MODEL;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), IMAGE_TIMEOUT_MS);
    try {
      let response;
      try {
        response = await fetch(OPENROUTER_IMAGE_URL, {
          method: 'POST',
          headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, prompt, aspect_ratio: aspectRatioFor(cur.tab), resolution: '1K', n: 1 }),
          signal: controller.signal
        });
      } catch (error) {
        throw new Error(error.name === 'AbortError' ? '等太久' : '連不到');
      }
      let data = null;

  function splitAIReply(txt) {

  }

  function errorDetail(data) {
    const first = Array.isArray(data) ? data[0] : data;

  function friendlyError(provider, status, detail) {
    if (provider === 'OpenRouter') {
      if (status === 401) return '金鑰不對';
      if (status === 402) return '全班的額度用完了';
      if (status === 404) return '模型名稱打錯了';
      if (status === 429) return '太多人同時在用';
    } else {
      if (status === 400 && /api[\s_-]*key/i.test(detail)) return '金鑰不對';
      if (status === 403) return '沒有權限';
      if (status === 404) return '模型名稱不對，或免費版不能用';
      if (status === 429) return '免費額度用完了';
    }
    return status ? `發生錯誤（HTTP ${status}）` : '發生錯誤';
  }

  function cleanAIText(text) {
    return String(text || '').replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
  }

  async function callAI(provider, input, settings) {
    const isOpenRouter = provider === 'OpenRouter';
    const key = (isOpenRouter ? settings.openRouterKey : settings.geminiKey || '').trim();
    const model = isOpenRouter
      ? (settings.openRouterCustomModel || '').trim() || settings.openRouterModel || DEFAULT_OPENROUTER_MODEL
      : settings.geminiModel || DEFAULT_GEMINI_MODEL;
    const messages = Array.isArray(input) ? input : [{ role: 'user', content: input }];
    const attempts = isOpenRouter ? 2 : 1;
    for (let attempt = 0; attempt < attempts; attempt++) {
      const requestMessages = attempt === 0 ? messages : [
        ...messages,
        { role: 'user', content: '請不要展開推理，直接依照前面的格式完成答案；內容精簡，但所有必要欄位都要保留。' }
      ];
      const body = { model, messages: requestMessages };
      if (isOpenRouter) {
        body.max_tokens = 8000;
        body.reasoning = { effort: settings.reasoning || 'low', exclude: true };
        body.usage = { include: true };
      }
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), AI_TIMEOUT_MS);
      let response;
      try {
        response = await fetch(isOpenRouter ? OPENROUTER_URL : GEMINI_URL, {
          method: 'POST',
          headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: controller.signal
        });
      } catch (e) {
        const reason = e.name === 'AbortError' ? '等太久' : '連不到（檢查網路）';
        throw { provider, reason };
      } finally {
        clearTimeout(timer);
      }
      let data = null;
      try { data = await response.json(); } catch (e) {}
      if (!response.ok) throw { provider, reason: friendlyError(provider, response.status, errorDetail(data)) };
      data = Array.isArray(data) ? data[0] : data;
      const choice = data?.choices?.[0] || {};
      const content = cleanAIText(choice.message?.content);
      const finishReason = choice.finish_reason || '';
      if (!content && finishReason === 'length' && attempt + 1 < attempts) continue;
      if (!content && finishReason === 'length') {
        throw { provider, reason: '連續兩次字數用完了，請換一個較快的 OpenRouter 模型' };
      }
      if (!content) throw { provider, reason: '沒有回傳文字' };
      return {
        provider,
        content,
        finishReason,
        usage: data?.usage || {}
      };
    }
  }

  // 共用的「問 AI」函式：依設定選擇服務，必要時自動換 Gemini
  async function askAI(input) {
    const s = load(K_SET, {});
    s.openRouterKey = s.openRouterKey || s.apiKey || '';
    const hasOpenRouter = Boolean(s.openRouterKey.trim());
    const hasGemini = Boolean((s.geminiKey || '').trim());
    if (!hasOpenRouter && !hasGemini) throw { message: '還沒填金鑰。按 ⚙ 設定。' };
    const mode = s.providerMode || 'fallback';
    if (mode === 'gemini') {
      if (!hasGemini) throw { message: 'Gemini：還沒填金鑰。按 ⚙ 設定。' };
      try { return await callAI('Gemini', input, s); }
      catch (e) { throw { message: `Gemini：${e.reason}` }; }
    }
    if (mode === 'openrouter') {
      if (!hasOpenRouter) throw { message: 'OpenRouter：還沒填金鑰。按 ⚙ 設定。' };
      try { return await callAI('OpenRouter', input, s); }
      catch (e) { throw { message: `OpenRouter：${e.reason}` + (!hasGemini ? '\n沒有備胎。' : '') }; }
    }
    let firstError = '';
    if (hasOpenRouter) {
      try { return await callAI('OpenRouter', input, s); }
      catch (e) { firstError = e.reason; }
    } else {
      firstError = '還沒填金鑰';
    }
    if (hasGemini) {
      try {
        const result = await callAI('Gemini', input, s);
        result.warning = `⚠️ OpenRouter：${firstError}。這次改用 Gemini。`;
        return result;
      } catch (e) {
        throw { message: `OpenRouter：${firstError}\nGemini：${e.reason}` };
      }
    }
    throw { message: `OpenRouter：${firstError}\n沒有備胎。` };
  }

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function money(value) {
    if (!Number.isFinite(value)) return '$—';
    const fixed = value.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
    return '$' + (fixed || '0');
  }

  function recordUsage(result) {
    const today = todayKey();
    let daily = load(K_USAGE, {});
    if (daily.date !== today) daily = { date: today, openRouterCount: 0, openRouterCost: 0, geminiCount: 0, imageCount: 0, imageCost: 0 };
    const totalTokens = Number(result.usage.total_tokens);
    const cost = Number(result.usage.cost);
    if (result.provider === 'OpenRouter') {
      daily.openRouterCount += 1;
      if (Number.isFinite(cost)) daily.openRouterCost += cost;
    } else {
      daily.geminiCount += 1;
    }
    store(K_USAGE, daily);
    const tokenText = Number.isFinite(totalTokens) ? totalTokens : '—';
    const currentCost = result.provider === 'OpenRouter' && Number.isFinite(cost) ? money(cost) : '$—';
    return `這次用 ${result.provider}：${tokenText} tokens 約 ${currentCost}｜今天 OpenRouter ${daily.openRouterCount} 次 ${money(daily.openRouterCost)}、Gemini ${daily.geminiCount} 次`;
  }

  function recordImageUsage(cost) {
    const today = todayKey();
    let daily = load(K_USAGE, {});
    if (daily.date !== today) daily = { date: today, openRouterCount: 0, openRouterCost: 0, geminiCount: 0, imageCount: 0, imageCost: 0 };
    daily.imageCount = Number(daily.imageCount) || 0;
    daily.imageCost = Number(daily.imageCost) || 0;
    daily.imageCount += 1;
    if (Number.isFinite(cost)) daily.imageCost += cost;
    store(K_USAGE, daily);
    return `這張約 ${money(cost)}｜今天生了 ${daily.imageCount} 張 約 ${money(daily.imageCost)}`;
  }

  // 直接請 AI 寫貼文
  $('btnAI').onclick = async () => {
    const button = $('btnAI');
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = '✨ AI 寫作中…';
    setAIStatus('AI 寫作中…');
    try {
      const ai = await askAI(buildPrompt());
      const usageText = recordUsage(ai);
      const placed = putAIReply(ai.content, true);
      const cutWarning = ai.finishReason === 'length' ? '⚠️ 回覆可能被切掉了。' : '';
      if (!placed.ok) {
        setAIStatus(`${usageText}${cutWarning ? `\n${cutWarning}` : ''}\n找不到【平台】標題。以下是 AI 原文：\n\n${ai.content}\n\n可以用「📥 貼回 AI 寫好的」手動分。`, true);
      } else {
        const warning = [ai.warning, cutWarning].filter(Boolean).join('\n');
        setAIResult(warning, `${usageText}\n${placed.message}`);
      }
    } catch (e) {
      setAIStatus(e.message || 'AI 發生錯誤。', true);
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  };

  // 手動貼回備案
  $('btnPaste').onclick = () => { $('pasteText').value = ''; $('pasteAsk').textContent = ''; open('mPaste'); };
  $('btnPasteGo').onclick = () => {
    const result = putAIReply($('pasteText').value);
    $('pasteAsk').textContent = result.message;
  };

  // AI 小幫手
  function platformChat(platform = cur.tab) {
    if (!Array.isArray(cur.chats[platform])) cur.chats[platform] = [];
    return cur.chats[platform];
  }

  function renderHelper() {
    const log = $('helperLog');
    if (!log) return;
    const chat = platformChat();
    log.textContent = '';
    if (!chat.length) {
      const empty = document.createElement('div');
      empty.className = 'small';
      empty.textContent = `還沒有 ${cur.tab} 的對話。`;
      log.appendChild(empty);
      return;
    }
    chat.forEach(message => {
      const item = document.createElement('div');
      item.className = `helper-msg ${message.role === 'user' ? 'helper-user' : 'helper-ai'}`;
      item.textContent = `${message.role === 'user' ? '我' : 'AI'}：${message.content}`;
      log.appendChild(item);
    });
    log.scrollTop = log.scrollHeight;
  }

  function helperMessages(platform, post, instruction, allPlatforms = false, posts = cur.posts) {
    const s = load(K_SET, {});
    const targetRule = allPlatforms
      ? '使用者會叫你同時修改【FB】【IG】【LINE】三篇貼文。請用【FB】【IG】【LINE】的標題分開回覆改好的三篇，只回覆貼文，不要解釋。'
      : `使用者會叫你修改一篇【${platform}】貼文。只回覆改好以後的整篇貼文，不要解釋、不要加標題。`;
    const system = `你是【${BRAND.name}】的小編助理。${targetRule}只改使用者要求的地方，其他保持原樣；不能加素材卡上沒有的事實；遵守品牌規格；一律用台灣的繁體中文和台灣用語。不要出現簡體字，也不要用大陸用語（例如：視頻→影片、質量→品質、優化→改善、信息→訊息、網絡→網路、用戶→客人或使用者）。

===== 品牌規格 =====
${s.spec || '（尚未填寫）'}

===== 素材卡 =====
${buildCardText()}`;
    const history = platformChat(platform).slice(-8).map(message => ({ role: message.role, content: message.content }));
    const currentText = allPlatforms
      ? `目前三個平台的貼文：\n${PLATFORMS.map(p => `【${p}】\n${posts[p] || ''}`).join('\n\n')}`
      : `目前的【${platform}】貼文：\n${post}`;
    return [
      { role: 'system', content: system },
      ...history,
      { role: 'user', content: `${currentText}\n\n請這樣改：${instruction}` }
    ];
  }

  function setHelperStatus(message, isError = false) {
    const box = $('helperStatus');
    box.textContent = message;
    box.style.color = isError ? '#b42318' : '';
  }

  function setHelperBusy(busy) {
    $('btnHelperSend').disabled = busy;
    $('helperInput').disabled = busy;
    $('helperAllPlatforms').disabled = busy;
    document.querySelectorAll('#helperQuick button').forEach(button => button.disabled = busy);
  }

  async function sendHelper(instruction) {
    instruction = (instruction || '').trim();
    if (!instruction) { setHelperStatus('請先輸入想怎麼修改。', true); return; }
    const platform = cur.tab;
    const allPlatforms = $('helperAllPlatforms').checked;
    const postsAtSend = { ...cur.posts };
    const post = (cur.posts[platform] || '').trim();
    const missingPost = allPlatforms
      ? PLATFORMS.some(p => !(postsAtSend[p] || '').trim())
      : !post;
    if (missingPost) { setHelperStatus('先讓 AI 寫一篇', true); return; }
    setHelperBusy(true);
    setHelperStatus('AI 小幫手修改中…');
    try {
      const ai = await askAI(helperMessages(platform, post, instruction, allPlatforms, postsAtSend));
      const usageText = recordUsage(ai);
      if (allPlatforms) {
        const placed = putAIReply(ai.content, true);
        if (!placed.ok) {
          setHelperStatus(`找不到【平台】標題。以下是 AI 原文：\n\n${ai.content}\n\n可以用「📥 貼回 AI 寫好的」手動分。`, true);
          return;
        }
      } else {
        savePreviousVersion();
        cur.posts[platform] = ai.content;
      }
      platformChat(platform).push(
        { role: 'user', content: instruction },
        { role: 'assistant', content: ai.content }
      );
      storeDraft();
      fill();
      $('helperInput').value = '';
      const warnings = [ai.warning, ai.finishReason === 'length' ? '⚠️ 回覆可能被切掉了。' : ''].filter(Boolean).join('\n');
      setHelperStatus(`${warnings ? warnings + '\n' : ''}${usageText}`);
    } catch (e) {
      setHelperStatus(e.message || 'AI 發生錯誤。', true);
    } finally {
      setHelperBusy(false);
    }
  }

  $('helperQuick').onclick = e => {
    const instruction = e.target.dataset.instruction;
    if (instruction) sendHelper(instruction);
  };
  $('btnHelperSend').onclick = () => sendHelper($('helperInput').value);

  // 檢查官：每次都是獨立的新對話
  const DEFAULT_CHECKLIST = `1. 日期價格對不對
2. 有沒有多加的事
3. 只能在某平台講的有沒有跑掉
4. 先不要講的有沒有出現
5. 有沒有不能用的字
6. 有沒有簡體字或大陸用語`;

  function checkerMessages() {
    const s = load(K_SET, {});
    const checklist = (s.check || '').trim() || DEFAULT_CHECKLIST;
    const system = `你是【${BRAND.name}】的審核官，專門挑毛病，不負責誇獎。把每一篇貼文照檢查清單一條一條對。✅ 符合；❌ 不符合（寫出哪一句有問題、該怎麼改）；⚠️ 要靠人判斷的，先給意見。回覆格式：【平台名稱】換行，然後每條一行「編號 符號 一句話」，最後【總結】列出要人工確認的事。不管清單有沒有寫，都另外檢查有沒有簡體字或大陸用語。報告也用台灣繁體中文寫。`;
    const posts = PLATFORMS.map(platform => `【${platform}】\n${(cur.posts[platform] || '').trim() || '（沒有貼文）'}`).join('\n\n');
    const user = `===== 品牌規格 =====
${s.spec || '（尚未填寫）'}

===== 素材卡 =====
${buildCardText()}

===== 檢查清單 =====
${checklist}

===== 各平台貼文 =====
${posts}`;
    return [{ role: 'system', content: system }, { role: 'user', content: user }];
  }

  function showCheckReport(text, isError = false) {
    const report = $('checkReport');
    report.textContent = '';
    String(text || '').split('\n').forEach(line => {
      const row = document.createElement('div');
      row.className = 'check-line';
      if (isError || line.includes('❌')) row.classList.add('check-error');
      else if (line.includes('⚠️') || line.includes('⚠')) row.classList.add('check-warning');
      row.textContent = line || ' ';
      report.appendChild(row);
    });
  }

  $('btnCheck').onclick = async () => {
    const hasPost = PLATFORMS.some(platform => (cur.posts[platform] || '').trim());
    if (!hasPost) { toast('還沒有貼文可以檢查'); return; }
    const button = $('btnCheck');
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = '🔍 檢查中…';
    try {
      const ai = await askAI(checkerMessages());
      recordUsage(ai);
      const notices = [ai.warning, ai.finishReason === 'length' ? '⚠️ 報告可能被切掉了。' : ''].filter(Boolean);
      $('checkMeta').textContent = notices.join('\n');
      $('checkMeta').style.color = notices.length ? '#b42318' : '';
      showCheckReport(ai.content);
      open('mCheck');
    } catch (e) {
      $('checkMeta').textContent = '';
      showCheckReport(e.message || 'AI 發生錯誤。', true);
      open('mCheck');
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  };

  // 上一版採交換方式，可在修改前後來回切換
  $('btnUndo').onclick = () => {
    if (!cur.previousPosts) { toast('還沒有上一版'); return; }
    const currentPosts = { ...cur.posts };
    cur.posts = { ...cur.previousPosts };
    cur.previousPosts = currentPosts;
    fill();
    toast('已換回上一版');
  };

  // 一鍵複製
  $('btnCopy').onclick = () => copy(cur.posts[cur.tab] || '', `${cur.tab} 已複製`);

  function setCloudSaveStatus(message, isError = false) {
    const status = $('cloudSaveStatus');
    status.textContent = message;
    status.style.color = isError ? '#b42318' : '';
  }

  function cloudSaveErrorZh(error) {
    const code = String(error?.code || '').toUpperCase();
    const message = String(error?.message || error || '未知錯誤');
    if (code === '42P01' || code === 'PGRST205') {
      return '雲端還沒有 posts 表，到 SQL Editor 貼建表那段按 Run';
    }
    if (code === '42501' || message.toLowerCase().includes('row-level security')) {
      return '雲端不讓你存，SQL 的權限那段沒跑到';
    }
    return message;
  }

  function setCloudSyncStatus(message, isError = false) {
    const status = $('cloudSyncStatus');
    status.textContent = message;
    status.style.color = isError ? '#b42318' : '';
  }

  function savedAtValue(post) {
    const savedAt = Number(post?.savedAt);
    return Number.isFinite(savedAt) ? savedAt : 0;
  }

  function idValue(post) {
    const numeric = Number(post?.id);
    return Number.isFinite(numeric) ? numeric : String(post?.id || '');
  }

  function sortSavedPosts(posts) {
    return [...posts].sort((a, b) => {
      const savedDiff = savedAtValue(b) - savedAtValue(a);
      if (savedDiff) return savedDiff;
      const aId = idValue(a), bId = idValue(b);
      if (typeof aId === 'number' && typeof bId === 'number') return bId - aId;
      return String(bId).localeCompare(String(aId));
    });
  }

  async function uploadAllPosts() {
    if (!sb || !me) { setCloudSyncStatus('先 🔐 登入', true); return; }
    const posts = load(K_POSTS, []);
    setCloudSyncStatus('正在上傳…');
    for (let index = 0; index < posts.length; index++) {
      const post = posts[index];
      try {
        const { error } = await sb.from('posts').upsert({
          id: String(post.id),
          user_id: me.id,
          data: post,
          publish_date: post.publishDate || null,
          updated_at: new Date().toISOString()
        }, { onConflict: 'user_id,id' });
        if (error) throw error;
        cloudPostIds.add(String(post.id));
      } catch (error) {
        setCloudSyncStatus(`第 ${index + 1} 篇上傳失敗：${cloudSaveErrorZh(error)}`, true);
        showList();
        return;
      }
    }
    setCloudSyncStatus(`上傳好了：${posts.length} 篇`);
    showList();
  }

  async function downloadAllPosts({ automatic = false } = {}) {
    if (!sb || !me) {
      if (!automatic) setCloudSyncStatus('先 🔐 登入', true);
      return;
    }
    if (!automatic) setCloudSyncStatus('正在從雲端拿回來…');
    try {
      const { data, error } = await sb.from('posts').select('data, updated_at');
      if (error) throw error;
      const localPosts = load(K_POSTS, []);
      const byId = new Map(localPosts.map(post => [String(post.id), post]));
      let added = 0, updated = 0;
      cloudPostIds.clear();
      for (const row of data || []) {
        if (!row?.data || row.data.id === undefined || row.data.id === null) continue;
        const remote = { ...row.data };
        const key = String(remote.id);
        cloudPostIds.add(key);
        const local = byId.get(key);
        if (!local) {
          byId.set(key, remote);
          added++;
        } else if (savedAtValue(remote) > savedAtValue(local)) {
          byId.set(key, remote);
          updated++;
        }
      }
      if (!store(K_POSTS, sortSavedPosts([...byId.values()]))) throw new Error('這台電腦的儲存空間不足');
      setCloudSyncStatus(`拿回來了：新增 ${added} 篇、更新 ${updated} 篇`);
      showList();
    } catch (error) {
      setCloudSyncStatus(`從雲端拿回來失敗：${cloudSaveErrorZh(error)}`, true);
    }
  }

  function maybeAutoDownload() {
    if (!localReady || !sb || !me?.id || autoSyncedUserIds.has(me.id)) return;
    autoSyncedUserIds.add(me.id);
    downloadAllPosts({ automatic: true });
  }

  // 存檔
  $('btnSave').onclick = async () => {
    const posts = load(K_POSTS, []);
    const name = [cur.fields.date || '', topic() || '未命名'].join(' ').trim();
    const rec = { id: cur.id || Date.now(), name, time: new Date().toLocaleString('zh-TW'), savedAt: Date.now(), publishDate: cur.publishDate || '', fields: { ...cur.fields }, posts: { ...cur.posts }, chats: { ...cur.chats }, previousPosts: cur.previousPosts ? { ...cur.previousPosts } : null, ...(imageWarehouseReady ? { imageIds: cur.images.map(pic => String(pic.id)) } : { images: cur.images.map(pic => ({ ...pic })) }), primaryImageId: cur.primaryImageId, imageText: { ...cur.imageText }, downloadSize: cur.downloadSize };
    cur.id = rec.id;
    const i = posts.findIndex(p => p.id === rec.id);
    if (i >= 0) posts[i] = rec; else posts.unshift(rec);
    if (!(store(K_POSTS, posts) && storeDraft())) return;
    toast('存好了：' + name);

    if (!sb || !me) {
      setCloudSaveStatus('只存在這台電腦。🔐 登入以後，會同時存到雲端');
      return;
    }

    setCloudSaveStatus('☁ 正在存到雲端…');
    try {
      const { error } = await sb.from('posts').upsert({
        id: String(rec.id),
        user_id: me.id,
        data: rec,
        publish_date: rec.publishDate || null,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,id' });
      if (error) throw error;
      cloudPostIds.add(String(rec.id));
      setCloudSaveStatus(`☁ 雲端也存了：${name}`);
      if ($('mList').classList.contains('show')) showList();
    } catch (error) {
      setCloudSaveStatus(`${cloudSaveErrorZh(error)}\n這台電腦有存到，不會不見`, true);
    }
  };

  // 我的貼文
  function showList() {
    const posts = sortSavedPosts(load(K_POSTS, []));
    $('list').innerHTML = posts.length ? posts.map(p =>
      `<div class="item"><div><b>${esc(String(p.name || '未命名'))}</b>${me ? ` <span class="small">${cloudPostIds.has(String(p.id)) ? '☁ 雲端有' : '只在這台'}</span>` : ''}<div class="small">${esc(String(p.time || ''))}${p.publishDate ? `｜📅 ${esc(String(p.publishDate))}` : ''}</div></div>
       <button data-open="${esc(String(p.id))}">打開</button><button class="light" data-del="${esc(String(p.id))}">刪除</button></div>`).join('')
      : '<p class="small">還沒有存過的貼文。</p>';
  }
  $('btnList').onclick = () => { showList(); open('mList'); };
  $('btnUploadAll').onclick = uploadAllPosts;
  $('btnDownloadAll').onclick = () => downloadAllPosts();
  $('list').onclick = async e => {
    const posts = load(K_POSTS, []);
    const o = e.target.dataset.open, d = e.target.dataset.del;
    if (o) {
      const p = posts.find(p => String(p.id) === o);
      try {
        cur = imageWarehouseReady
          ? await hydrateRecord({ ...p, tab: PLATFORMS[0] })
          : normalizeCur({ ...p, tab: PLATFORMS[0] }, Array.isArray(p.images) ? p.images.filter(image => image?.dataUrl) : []);
        fill(); $('mList').classList.remove('show'); toast('打開：' + p.name);
      } catch (error) {
        warehouseError = '圖片倉庫暫時無法讀取'; renderStorageUsage(); toast('這篇的圖片打不開');
      }
    }
    if (d) {
      const message = me ? '確定要刪除這一篇嗎？雲端的也會一起刪' : '確定要刪除這一篇嗎？';
      if (!confirm(message)) return;
      if (me) {
        try {
          const { error } = await sb.from('posts').delete().eq('id', d);
          if (error) throw error;
          cloudPostIds.delete(d);
        } catch (error) {
          setCloudSyncStatus(`刪除失敗：${cloudSaveErrorZh(error)}\n這台電腦的貼文還留著`, true);
          return;
        }
      }
      store(K_POSTS, posts.filter(p => String(p.id) !== d));
      showList();
    }
  };

  // 新的一篇
  $('btnNew').onclick = () => { if (confirm('清空畫面，開始新的一篇？（存過的不會不見）')) { cur = blank(); fill(); } };

  async function initialize() {
    try {
      await openImageDb();
      const migratedDraft = await migrateLegacyImages();
      imageWarehouseReady = true;
      cur = await hydrateRecord(migratedDraft || blank());
      warehouseError = '';
      fill();
    } catch (error) {
      imageWarehouseReady = false;
      warehouseError = '圖片倉庫打不開，舊圖片沒有搬動';
      const legacy = load(K_DRAFT, blank());
      const legacyImages = Array.isArray(legacy.images) ? legacy.images.filter(image => image?.dataUrl) : [];
      cur = normalizeCur(legacy, legacyImages);
      fill(false);
      renderStorageUsage();
    }
    localReady = true;
    maybeAutoDownload();
  }
  initializeAuth();
  initialize();
</script>

</body>
</html>
